name: Create IPA Packages

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "URL to the decrypted IPA file (direct link or Google Drive share link)"
        default: ""
        required: true
        type: string
      tweak_url:
        description: "URL to the EeveeSpotify tweak DEB file (direct link or Google Drive share link)"
        default: ""
        required: true
        type: string

env:
  SWIFTPROTOBUF_VERSION: "1.29.0"

jobs:
  build:
    runs-on: macos-latest
    env:
      THEOS: ${{ github.workspace }}/theos

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Hide Sensitive Inputs
        uses: levibostian/action-hide-sensitive-inputs@v1

      - name: Install download tools
        run: python3 -m pip install --break-system-packages gdown

      - name: Download and Validate IPA
        shell: bash
        env:
          IPA_URL: ${{ inputs.ipa_url }}
        run: |
          set -euo pipefail
          OUTPUT="$GITHUB_WORKSPACE/spotify.ipa"

          if [[ "$IPA_URL" == *google.com* ]]; then
            # Handles drive.google.com, docs.google.com and drive.usercontent.google.com links.
            FILE_ID="$(printf '%s' "$IPA_URL" | sed -nE 's#.*/d/([A-Za-z0-9_-]+).*#\1#p; s#.*[?&]id=([A-Za-z0-9_-]+).*#\1#p' | head -n1)"
            if [[ -z "$FILE_ID" ]]; then
              echo "::error::Could not find a Google Drive file ID in the URL."
              exit 1
            fi
            gdown "https://drive.google.com/uc?id=$FILE_ID" -O "$OUTPUT"
          else
            curl --fail --location --show-error --retry 3 "$IPA_URL" -o "$OUTPUT"
          fi

          if [[ ! -s "$OUTPUT" ]]; then
            echo "::error::IPA download is empty or missing."
            exit 1
          fi

          FILE_TYPE="$(file --mime-type -b "$OUTPUT" || true)"
          if [[ "$FILE_TYPE" == "text/html" || "$FILE_TYPE" == "application/xhtml+xml" ]]; then
            echo "::error::The URL returned an HTML webpage instead of an IPA. Make sure the file is publicly accessible and use a direct download or valid Google Drive share link."
            head -c 300 "$OUTPUT" || true
            echo
            exit 1
          fi

          if ! unzip -tq "$OUTPUT" >/dev/null 2>&1; then
            echo "::error::The downloaded file is not a valid ZIP/IPA archive (detected type: $FILE_TYPE). Check the URL and sharing permissions."
            exit 1
          fi

          if ! unzip -Z1 "$OUTPUT" | grep -Eq '^Payload/[^/]+\.app/'; then
            echo "::error::The archive does not contain Payload/*.app and does not appear to be a valid iOS IPA."
            exit 1
          fi

          echo "IPA download and validation passed."

      - name: Download and Validate Tweak
        shell: bash
        env:
          TWEAK_URL: ${{ inputs.tweak_url }}
        run: |
          set -euo pipefail
          OUTPUT="$GITHUB_WORKSPACE/eeveespotify.deb"

          if [[ "$TWEAK_URL" == *google.com* ]]; then
            # Handles drive.google.com, docs.google.com and drive.usercontent.google.com links.
            FILE_ID="$(printf '%s' "$TWEAK_URL" | sed -nE 's#.*/d/([A-Za-z0-9_-]+).*#\1#p; s#.*[?&]id=([A-Za-z0-9_-]+).*#\1#p' | head -n1)"
            if [[ -z "$FILE_ID" ]]; then
              echo "::error::Could not find a Google Drive file ID in the URL."
              exit 1
            fi
            gdown "https://drive.google.com/uc?id=$FILE_ID" -O "$OUTPUT"
          else
            curl --fail --location --show-error --retry 3 "$TWEAK_URL" -o "$OUTPUT"
          fi

          if [[ ! -s "$OUTPUT" ]]; then
            echo "::error::Tweak download is empty or missing."
            exit 1
          fi

          FILE_TYPE="$(file --mime-type -b "$OUTPUT" || true)"
          if [[ "$FILE_TYPE" == "text/html" || "$FILE_TYPE" == "application/xhtml+xml" ]]; then
            echo "::error::The tweak URL returned HTML instead of a DEB package. Check the link and sharing permissions."
            head -c 300 "$OUTPUT" || true
            echo
            exit 1
          fi

          if ! ar t "$OUTPUT" >/dev/null 2>&1; then
            echo "::error::The downloaded tweak is not a valid Debian package (detected type: $FILE_TYPE)."
            exit 1
          fi

          echo "Tweak download and validation passed."

      - name: Download SwiftProtobuf packages
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --show-error --retry 3 \
            "https://github.com/whoeevee/swift-protobuf/releases/download/${SWIFTPROTOBUF_VERSION}/org.swift.protobuf.swiftprotobuf_${SWIFTPROTOBUF_VERSION}_iphoneos-arm.deb" \
            -o "org.swift.protobuf.swiftprotobuf_${SWIFTPROTOBUF_VERSION}_iphoneos-arm.deb"
          curl --fail --location --show-error --retry 3 \
            "https://github.com/whoeevee/swift-protobuf/releases/download/${SWIFTPROTOBUF_VERSION}/org.swift.protobuf.swiftprotobuf_${SWIFTPROTOBUF_VERSION}_iphoneos-arm64.deb" \
            -o "org.swift.protobuf.swiftprotobuf_${SWIFTPROTOBUF_VERSION}_iphoneos-arm64.deb"

          echo "SWIFTPROTOBUF_ROOTFUL=org.swift.protobuf.swiftprotobuf_${SWIFTPROTOBUF_VERSION}_iphoneos-arm.deb" >> "$GITHUB_ENV"
          echo "SWIFTPROTOBUF_ROOTLESS=org.swift.protobuf.swiftprotobuf_${SWIFTPROTOBUF_VERSION}_iphoneos-arm64.deb" >> "$GITHUB_ENV"

      - name: Download OpenSpotifySafariExtension
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/BillyCurtis/OpenSpotifySafariExtension
          echo "OPENSPOTIFYSAFARIEXTENSION=OpenSpotifySafariExtension/OpenSpotifySafariExtension.appex" >> "$GITHUB_ENV"

      - name: Set up insert-dylib
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/Tyilo/insert_dylib.git
          xcrun clang -x c -arch arm64 ./insert_dylib/insert_dylib/main.c -I/usr/include/ -o insert-dylib
          sudo mv insert-dylib /usr/local/bin/insert-dylib
          sudo chmod +x /usr/local/bin/insert-dylib

      - name: Set up ivinject
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/whoeevee/ivinject.git
          mkdir -p "$HOME/.ivinject"
          cp -R ./ivinject/KnownFrameworks/. "$HOME/.ivinject/"
          curl --fail --location --show-error --retry 3 \
            https://github.com/whoeevee/ivinject/releases/download/first/ivinject-arm64 \
            -o ivinject-arm64
          sudo mv ivinject-arm64 /usr/local/bin/ivinject-arm64
          sudo chmod +x /usr/local/bin/ivinject-arm64

      - name: Set up ipapatch
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --show-error --retry 3 \
            https://github.com/asdfzxcvbn/ipapatch/releases/download/v2.1.0/ipapatch.macos-arm64 \
            -o ipapatch.macos-arm64
          sudo mv ipapatch.macos-arm64 /usr/local/bin/ipapatch
          sudo chmod +x /usr/local/bin/ipapatch

      - name: Create EeveeSpotify Package
        shell: bash
        run: |
          set -euo pipefail
          ivinject-arm64 "$GITHUB_WORKSPACE/spotify.ipa" "$GITHUB_WORKSPACE/EeveeSpotify.ipa" \
            -i "$GITHUB_WORKSPACE/eeveespotify.deb" "$SWIFTPROTOBUF_ROOTFUL" "$OPENSPOTIFYSAFARIEXTENSION" \
            -s - -d --level Optimal

          if [[ ! -s "$GITHUB_WORKSPACE/EeveeSpotify.ipa" ]]; then
            echo "::error::ivinject did not produce EeveeSpotify.ipa."
            exit 1
          fi

      - name: Create Patched Package
        shell: bash
        run: |
          set -euo pipefail
          ipapatch -input "$GITHUB_WORKSPACE/EeveeSpotify.ipa" -output "$GITHUB_WORKSPACE/EeveeSpotify-patched.ipa"

          if [[ ! -s "$GITHUB_WORKSPACE/EeveeSpotify-patched.ipa" ]]; then
            echo "::error::ipapatch did not produce EeveeSpotify-patched.ipa."
            exit 1
          fi

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v2.0.1
        with:
          tag_name: eevee-${{ github.run_number }}
          name: EeveeSpotify (${{ github.run_number }})
          files: |
            EeveeSpotify.ipa
            EeveeSpotify-patched.ipa
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Output Release URL
        shell: bash
        run: |
          echo "::notice::Draft release page: https://github.com/${GITHUB_REPOSITORY}/releases"
