
name: Create IPA Packages

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "URL to the decrypted IPA file (direct link or Google Drive share link)"
        default: ""
        required: true
        type: string
      tweak_url:
        description: "URL to the EeveeSpotify tweak file (direct link or Google Drive share link)"
        default: ""
        required: true
        type: string

env:
  SWIFTPROTOBUF_VERSION: "1.29.0"

jobs:
  build:
    runs-on: macos-latest
    env:
      THEOS: ${{ github.workspace }}/theos

    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Hide Sensitive Inputs
        uses: levibostian/action-hide-sensitive-inputs@v1

      - name: Install gdown
        run: python3 -m pip install --break-system-packages gdown

      - name: Download and Validate IPA
        shell: bash
        env:
          IPA_URL: ${{ inputs.ipa_url }}
        run: |
          set -euo pipefail
          OUTPUT="$GITHUB_WORKSPACE/spotify.ipa"

          if [[ "$IPA_URL" == *drive.google.com* ]]; then
            FILE_ID=$(python3 -c '
          import sys
          from urllib.parse import urlparse, parse_qs
          u = urlparse(sys.argv[1])
          parts = u.path.split("/")
          fid = ""
          if "d" in parts:
              i = parts.index("d")
              if i + 1 < len(parts):
                  fid = parts[i + 1]
          if not fid:
              fid = parse_qs(u.query).get("id", [""])[0]
          if not fid:
              raise SystemExit("Could not extract Google Drive file ID")
          print(fid)
          ' "$IPA_URL")
            gdown "$FILE_ID" -O "$OUTPUT"
          else
            curl -fL --retry 3 "$IPA_URL" -o "$OUTPUT"
          fi

          if [[ ! -s "$OUTPUT" ]]; then
            echo "::error::IPA download is empty or missing."
            exit 1
          fi

          FILE_TYPE=$(file --mime-type -b "$OUTPUT")
          if [[ "$FILE_TYPE" != "application/x-ios-app" && "$FILE_TYPE" != "application/zip" && "$FILE_TYPE" != "application/octet-stream" ]]; then
            echo "::error::Unexpected IPA file type: $FILE_TYPE"
            exit 1
          fi

          if ! unzip -tq "$OUTPUT" >/dev/null; then
            echo "::error::Downloaded IPA is not a valid ZIP archive."
            exit 1
          fi

          if ! unzip -Z1 "$OUTPUT" | grep -Eq '^Payload/[^/]+\.app/'; then
            echo "::error::IPA archive does not contain Payload/*.app."
            exit 1
          fi

          echo "IPA download and validation passed."

      - name: Download and Validate Tweak
        shell: bash
        env:
          TWEAK_URL: ${{ inputs.tweak_url }}
        run: |
          set -euo pipefail
          OUTPUT="$GITHUB_WORKSPACE/eeveespotify.deb"

          if [[ "$TWEAK_URL" == *drive.google.com* ]]; then
            FILE_ID=$(python3 -c '
          import sys
          from urllib.parse import urlparse, parse_qs
          u = urlparse(sys.argv[1])
          parts = u.path.split("/")
          fid = ""
          if "d" in parts:
              i = parts.index("d")
              if i + 1 < len(parts):
                  fid = parts[i + 1]
          if not fid:
              fid = parse_qs(u.query).get("id", [""])[0]
          if not fid:
              raise SystemExit("Could not extract Google Drive file ID")
          print(fid)
          ' "$TWEAK_URL")
            gdown "$FILE_ID" -O "$OUTPUT"
          else
            curl -fL --retry 3 "$TWEAK_URL" -o "$OUTPUT"
          fi

          if [[ ! -s "$OUTPUT" ]]; then
            echo "::error::Tweak download is empty or missing."
            exit 1
          fi

          FILE_TYPE=$(file --mime-type -b "$OUTPUT")
          if [[ "$FILE_TYPE" != "application/vnd.debian.binary-package" && "$FILE_TYPE" != "application/x-debian-package" ]]; then
            echo "::error::Unexpected DEB file type: $FILE_TYPE"
            exit 1
          fi

          if ! ar t "$OUTPUT" >/dev/null 2>&1; then
            echo "::error::Downloaded tweak is not a valid Debian package."
            exit 1
          fi

          echo "Tweak download and validation passed."

      - name: Download SwiftProtobuf
        run: |
          set -euo pipefail

          curl -fL --retry 3 \
            "https://github.com/whoeevee/swift-protobuf/releases/download/${SWIFTPROTOBUF_VERSION}/org.swift.protobuf.swiftprotobuf_${SWIFTPROTOBUF_VERSION}_iphoneos-arm.deb" \
            -o "org.swift.protobuf.swiftprotobuf_${SWIFTPROTOBUF_VERSION}_iphoneos-arm.deb"

          curl -fL --retry 3 \
            "https://github.com/whoeevee/swift-protobuf/releases/download/${SWIFTPROTOBUF_VERSION}/org.swift.protobuf.swiftprotobuf_${SWIFTPROTOBUF_VERSION}_iphoneos-arm64.deb" \
            -o "org.swift.protobuf.swiftprotobuf_${SWIFTPROTOBUF_VERSION}_iphoneos-arm64.deb"

          echo "SWIFTPROTOBUF_ROOTFUL=org.swift.protobuf.swiftprotobuf_${SWIFTPROTOBUF_VERSION}_iphoneos-arm.deb" >> "$GITHUB_ENV"
          echo "SWIFTPROTOBUF_ROOTLESS=org.swift.protobuf.swiftprotobuf_${SWIFTPROTOBUF_VERSION}_iphoneos-arm64.deb" >> "$GITHUB_ENV"

      - name: Download OpenSpotifySafariExtension
        run: |
          set -euo pipefail
          git clone https://github.com/BillyCurtis/OpenSpotifySafariExtension
          echo "OPENSPOTIFYSAFARIEXTENSION=OpenSpotifySafariExtension/OpenSpotifySafariExtension.appex" >> "$GITHUB_ENV"

      - name: Setup insert-dylib
        run: |
          set -euo pipefail
          git clone https://github.com/Tyilo/insert_dylib.git
          xcrun clang -x c -arch arm64 ./insert_dylib/insert_dylib/main.c -I/usr/include/ -o insert-dylib
          sudo mv insert-dylib /usr/local/bin/
          sudo chmod +x /usr/local/bin/insert-dylib

      - name: Setup ivinject
        run: |
          set -euo pipefail
          git clone https://github.com/whoeevee/ivinject.git
          mkdir -p "$HOME/.ivinject"
          cp -R ./ivinject/KnownFrameworks/. "$HOME/.ivinject/"
          curl -fL --retry 3 \
            https://github.com/whoeevee/ivinject/releases/download/first/ivinject-arm64 \
            -o ivinject-arm64
          sudo mv ivinject-arm64 /usr/local/bin/
          sudo chmod +x /usr/local/bin/ivinject-arm64

      - name: Setup ipapatch
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            https://github.com/asdfzxcvbn/ipapatch/releases/download/v2.1.0/ipapatch.macos-arm64 \
            -o ipapatch.macos-arm64
          sudo mv ipapatch.macos-arm64 /usr/local/bin/ipapatch
          sudo chmod +x /usr/local/bin/ipapatch

      - name: Create EeveeSpotify Package
        run: |
          set -euo pipefail
          ivinject-arm64 "$GITHUB_WORKSPACE/spotify.ipa" "$GITHUB_WORKSPACE/EeveeSpotify.ipa" \
            -i "$GITHUB_WORKSPACE/eeveespotify.deb" "$SWIFTPROTOBUF_ROOTFUL" "$OPENSPOTIFYSAFARIEXTENSION" \
            -s - -d --level Optimal

      - name: Create Patched Package
        run: |
          set -euo pipefail
          ipapatch -input "$GITHUB_WORKSPACE/EeveeSpotify.ipa" -output "$GITHUB_WORKSPACE/EeveeSpotify-patched.ipa"

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v2.0.1
        with:
          tag_name: eevee-${{ github.run_number }}
          name: EeveeSpotify (${{ github.run_number }})
          files: |
            EeveeSpotify.ipa
            EeveeSpotify-patched.ipa
          draft: true

      - name: Output Release URL
        run: |
          echo "::notice::Release available at: https://github.com/${{ github.repository }}/releases"
