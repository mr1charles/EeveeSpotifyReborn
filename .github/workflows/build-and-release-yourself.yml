
name: Download Spotify IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  download-ipa:
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install download dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install gdown

      - name: Download Spotify IPA
        shell: bash
        env:
          SPOTIFY_URL: https://drive.google.com/file/d/1nidA45MYDcSugU--181Pss9ySxukkOAj/view?usp=sharing
        run: |
          set -euo pipefail

          OUTPUT="$GITHUB_WORKSPACE/Spotify.ipa"

          if [[ "$SPOTIFY_URL" =~ /file/d/([^/?]+) ]]; then
            FILE_ID="${BASH_REMATCH[1]}"
          elif [[ "$SPOTIFY_URL" =~ [\?\&]id=([^&]+) ]]; then
            FILE_ID="${BASH_REMATCH[1]}"
          else
            echo "::error::Could not extract Google Drive file ID"
            exit 1
          fi

          echo "Downloading IPA from Google Drive..."
          gdown "$FILE_ID" --output "$OUTPUT"

          if [[ ! -s "$OUTPUT" ]]; then
            echo "::error::The downloaded IPA is missing or empty"
            exit 1
          fi

          echo "IPA downloaded successfully."

      - name: Validate IPA
        shell: bash
        run: |
          set -euo pipefail

          IPA="$GITHUB_WORKSPACE/Spotify.ipa"

          if ! unzip -tq "$IPA" >/dev/null; then
            echo "::error::The downloaded file is not a valid ZIP/IPA archive"
            exit 1
          fi

          if ! unzip -Z1 "$IPA" | grep -Eq '^Payload/[^/]+\.app/'; then
            echo "::error::The archive does not contain a Payload/*.app directory"
            exit 1
          fi

          echo "IPA archive validation passed."

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Spotify-IPA
          path: Spotify.ipa
          if-no-files-found: error
          retention-days: 7
